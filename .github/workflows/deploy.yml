name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without a commit, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the in-flight one instead of cancelling it, so a deploy
# never lands out of order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No actions/configure-pages step: its enablement:true needs a token that can
      # change repo settings, which GITHUB_TOKEN is not granted. Pages source must be
      # set to "GitHub Actions" once by hand in Settings -> Pages. Nothing else here
      # needs the action's outputs — basePath is hardcoded below.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build static export
        # Project site is served from /flower-shop — see next.config.mjs.
        env:
          NEXT_PUBLIC_BASE_PATH: /flower-shop
        run: npm run build

      # Pages' branch-based serving runs Jekyll, which drops _next/. Harmless
      # insurance for the artifact path too.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
