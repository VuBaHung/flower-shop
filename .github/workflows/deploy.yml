name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without a commit, from the Actions tab.
  workflow_dispatch:
  # The admin app's "Đăng lên website" button (PLAN.md §3). Publishing content must not
  # require a commit.
  repository_dispatch:
    types: [publish-storefront]
  # Fallback + campaign scheduling (PLAN.md §3): campaigns activate and expire against the
  # BUILD date, so the site has to rebuild on its own even if nobody touches it.
  # 01:00 Asia/Ho_Chi_Minh = 18:00 UTC the previous day.
  schedule:
    - cron: '0 18 * * *'

permissions:
  # contents: write so the daily snapshot (PLAN.md §3A.4) can be committed back.
  contents: write
  pages: write
  id-token: write

# A queued run waits for the in-flight one instead of cancelling it, so a deploy
# never lands out of order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` cannot be referenced from a step-level `if:` — GitHub rejects the whole
    # workflow file. Hoisting it here makes it readable as `env.HAS_DB` in those
    # conditions, which is allowed.
    env:
      HAS_DB: ${{ secrets.MONGODB_URI != '' }}
    steps:
      - uses: actions/checkout@v4

      # No actions/configure-pages step: its enablement:true needs a token that can
      # change repo settings, which GITHUB_TOKEN is not granted. Pages source must be
      # set to "GitHub Actions" once by hand in Settings -> Pages. Nothing else here
      # needs the action's outputs — basePath is hardcoded below.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build static export
        # Project site is served from /flower-shop — see next.config.mjs.
        # DATA_SOURCE stays 'fixtures' until the MONGODB_* secrets are added in
        # Settings -> Secrets; the build then switches to live data with no code change.
        env:
          NEXT_PUBLIC_BASE_PATH: /flower-shop
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'fixtures' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: npm run build

      # PLAN.md §3A.4: MongoDB M0 has no automated backup, so every build commits a dated
      # JSON snapshot. No-ops when the database isn't configured yet.
      - name: Snapshot database
        if: env.HAS_DB == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: node scripts/snapshot.mjs

      - name: Commit snapshot
        if: env.HAS_DB == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/snapshots/
          # Nothing to commit when the catalog is unchanged since the last run.
          git diff --staged --quiet || git commit -m 'chore: daily catalog snapshot'
          git push

      # Pages' branch-based serving runs Jekyll, which drops _next/. Harmless
      # insurance for the artifact path too.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
